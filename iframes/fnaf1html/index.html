<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FNAF 1 Office</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-screen">
        <div id="office-container">
            <img src="assets/images/519.png" id="office-bg" alt="FNAF 1 Office">

            <div class="obj-label dev-ui" style="left: calc((20 / 1600) * 100%); top: calc((240 / 720) * 100%);">Left Btn<br>X: 0 | Y: 280</div>
            <div class="obj-label dev-ui" style="left: calc((1492 / 1600) * 100%); top: calc((240 / 720) * 100%);">Right Btn<br>X: 1492 | Y: 280</div>

            <img src="assets/images/88.png" id="left-door" class="door-sprite draggable dev-ui-ignore" draggable="false" alt="Left Door" style="left: calc((88 / 1600) * 100%); top: 0;">
            <img src="assets/images/104.png" id="right-door" class="door-sprite draggable dev-ui-ignore" draggable="false" alt="Right Door" style="left: calc((104 / 1600) * 100%); top: 0;">
            
            <img src="assets/images/122.png" id="left-btn" class="door-btn draggable" draggable="false" alt="Left Door Button">
            <img src="assets/images/134.png" id="right-btn" class="door-btn draggable" draggable="false" alt="Right Door Button">

            <div id="fan-wrapper" class="draggable">
                <div class="obj-label dev-ui" style="left: 50%; top: -30px; transform: translateX(-50%);">Desk Fan<br>X: 780 | Y: 303</div>
                <img id="fan-img" src="assets/images/57.png" alt="Desk Fan">
            </div>
        </div>

        <!-- Dev Mode Panels -->
        <div id="ui-panel" class="ui-box dev-ui">
            <p id="coord-display">Mouse: X: 0 | Y: 0</p>
        </div>

        <div id="saved-coords" class="ui-box dev-ui">
            <strong>Saved Points (Press P)</strong>
        </div>

        <div id="state-panel" class="ui-box dev-ui">
            <strong>Variables State</strong>
            <div id="state-content"></div>
        </div>

        <div id="power-panel" class="ui-box dev-ui">
            <strong>Power State</strong>
            <p id="power-display">Power: 100%</p>
            <p id="usage-display">Usage: 1</p>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
    <audio id="door-sound" src="assets/audio/door.mp3"></audio>
</body>
</html>
