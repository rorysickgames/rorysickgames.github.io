<!DOCTYPE html>

    <style>
        /* --- DESIGN & LOOKS --- */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f9;
        }

        /* Top menu bar */
        nav {
            background-color: #333;
            padding: 15px;
            text-align: center;
        }

        nav button {
            background-color: #555;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 0 5px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
        }

        nav button:hover {
            background-color: #777;
        }



        /* Hide/Show logic for pages */
        .page {
            display: none;
        }

        .active-page {
            display: block;
        }

        /* --- STYLES FOR THE DOWNLOAD LISTS --- */
        .download-list {
            list-style-type: none; /* Removes standard bullet points */
            padding: 0;
        }

        .download-list li {
            margin-bottom: 25px; /* Keeps spacing between items */
        }

        .download-list h3 {
            margin-top: 0;
            margin-bottom: 5px;
            color: #333;
        }

        .download-list p {
            margin: 0 0 10px 0;
            color: #666;
            line-height: 1.4;
        }

        /* The download button */
        a.download-btn {
            display: inline-block;
            padding: 8px 15px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
        }

        a.download-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <script>
        function showPage(pageId) {
            // Find all pages and hide them
            let allPages = document.querySelectorAll('.page');
            for (let i = 0; i < allPages.length; i++) {
                allPages[i].classList.remove('active-page');
            }

            // Show the page that was clicked
            document.getElementById(pageId).classList.add('active-page');
        }
    </script>
